# Actions fixadas pelo SHA do commit, com a versão em comentário (TRD Adendo v1.71, item S2): uma
# tag ou um ramo (`@v4`, `@master`) pode ser movido por quem controla a action, e o passo seguinte
# corre com os segredos deste workflow. O Dependabot (.github/dependabot.yml) propõe as subidas.
name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

# Só leitura do repositório (TRD Adendo v1.71, item S2): o token automático do GitHub deixa de
# poder escrever no repo, abrir releases ou mexer em packages, se um passo do workflow for
# comprometido. Nenhum passo precisa de mais do que ler o código.
permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # E2E sobre o build com o backend simulado no browser (ver playwright.config.ts). Só o
      # Chromium: é o motor do público-alvo (Chrome em Android).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
